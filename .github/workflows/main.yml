name: Build Aron Arik Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aron-&-arik-ai-photo-studio.zip'
      - 'android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: 
          unzip -o '.github/workflows/aron-&-arik-ai-photo-studio.zip' -d project
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: project/android
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aron-Arik-AI-Photo-Studio-APK
          path: project/android/app/build/outputs/apk/debug/*.apk
